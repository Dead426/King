<section class="kb-hero-switch">
  <div class="kb-switch-media">
    <figure class="kb-switch-image">
      <img src="image-1.jpg" alt="Product angle one" />
    </figure>
    <figure class="kb-switch-image">
      <img src="image-2.jpg" alt="Product angle two" />
    </figure>
    <figure class="kb-switch-image">
      <img src="image-3.jpg" alt="Product angle three" />
    </figure>
  </div>

  <div class="kb-switch-captions">
    <div class="kb-slide-caption">
      <p>Slide 1 Eyebrow</p>
      <h1>Title for image 1</h1>
      <p>Custom text for image 1</p>
      <a href="#">Button for image 1</a>
    </div>
    <div class="kb-slide-caption">
      <p>Slide 2 Eyebrow</p>
      <h1>Title for image 2</h1>
      <p>Custom text for image 2</p>
      <a href="#">Button for image 2</a>
    </div>
    <div class="kb-slide-caption">
      <p>Slide 3 Eyebrow</p>
      <h1>Title for image 3</h1>
      <p>Custom text for image 3</p>
      <a href="#">Button for image 3</a>
    </div>
  </div>

  <div class="kb-switch-dots"></div>
  <div class="kb-switch-arrows"></div>
</section>
